<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A+ Quest Giver Visual Map Editor v3</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#efe7d5;background:#091118;--gold:#deb96f;--blue:#65c7ff;--green:#67db9b;--gray:#aab2b8}*{box-sizing:border-box}body{margin:0;min-width:340px;background:#091118}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#101c25;border-bottom:1px solid #8d6c3d}.brand{margin-right:auto}.brand b{font:700 18px Georgia,serif;color:#f1d28f}.brand small{display:block;color:#aeb8bd}.toolbar{display:flex;gap:7px;flex-wrap:wrap}button,.filebtn,input,select,textarea{font:inherit}button,.filebtn{border:1px solid #ffffff2d;background:#172731;color:#edf1f2;padding:7px 10px;border-radius:6px;cursor:pointer}.primary{border-color:#d9b86c;color:#f6d990}.on{background:#c4994f;color:#0b1115;border-color:#f4d99b;font-weight:700}.shell{height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(0,1fr) 330px}.work{min-width:0;overflow:auto;display:grid;place-items:center;padding:12px;background:radial-gradient(circle,#243b48,#0b141b 65%)}.map{position:relative;width:min(100%,calc((100vh - 105px)*1.5));aspect-ratio:3/2;background:#17232b;overflow:hidden;border:2px solid #9b743d;box-shadow:0 16px 55px #000}.map img{width:100%;height:100%;display:block;user-select:none;pointer-events:none}.shade-svg,.edit-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shade-svg path{fill:#000;fill-rule:evenodd;opacity:.68}.poly{fill:#55caff22;stroke:#65c7ff;stroke-width:.35;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:all}.poly:hover,.poly:focus{fill:#ffd86f33;stroke:#ffe39c;outline:none}.poly.active{fill:#64d89c30;stroke:#72eaaa}.vertex{fill:#fff;stroke:#111;stroke-width:.2;cursor:move;pointer-events:all}.crop{fill:#ffd86f20;stroke:#ffd86f;stroke-width:.35;stroke-dasharray:1 .6;vector-effect:non-scaling-stroke;pointer-events:none}.loc{position:absolute;transform:translate(-50%,-50%);border:2px solid #111;background:#f4d075;color:#111;border-radius:50%;width:24px;height:24px;padding:0;font-weight:800;display:grid;place-items:center;box-shadow:0 0 8px #000}.loc.station{background:#6bcaff}.loc.hidden{background:#171d21;color:#ffe28d;border-color:#ffe28d}.loc.locked{filter:grayscale(.8);opacity:.75}.loc span{display:none;position:absolute;top:28px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#071018ee;color:#fff;padding:5px 7px;border-radius:5px;border:1px solid #ffffff55;z-index:4}.loc:hover span,.loc:focus span{display:block}.side{overflow:auto;background:#101a22;border-left:1px solid #ffffff1c;padding:16px}.side h2{font:700 22px Georgia,serif;color:#f2d597;margin:4px 0}.side h3{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#aeb9be;margin-top:20px}.side p{line-height:1.45;color:#cad3d6}.region-list{display:grid;gap:5px}.region-list button{text-align:left;width:100%}.status{display:inline-flex;border:1px solid #ffffff33;padding:4px 7px;border-radius:14px;font-size:12px}.fields{display:grid;gap:8px}.fields label{font-size:12px;color:#bac4c8}.fields input,.fields select,.fields textarea{width:100%;border:1px solid #ffffff2c;background:#09131a;color:#fff;border-radius:5px;padding:7px}.fields textarea{min-height:80px;resize:vertical}.row{display:flex;gap:6px}.row>*{flex:1}.help{padding:10px;background:#ffffff09;border-left:3px solid #d5b265;font-size:12px;color:#b9c3c7;line-height:1.45}.crumb{font-size:12px;color:#d9be85;margin-bottom:7px}.empty{color:#839099;font-style:italic}.modeBadge{font-size:11px;padding:4px 6px;border:1px solid #ffffff2c;border-radius:4px}.cropView img{position:absolute;max-width:none;pointer-events:none}.cropView{background:#10171c}.drawHint{position:absolute;bottom:10px;left:10px;background:#071018e8;color:#fff;padding:7px 9px;border:1px solid #dfba6b;border-radius:5px;font-size:12px;z-index:5}.danger{border-color:#9e5252;color:#ffb6b6}.preview-title{font:700 28px Georgia,serif;color:#f5d99d}.preview-list{padding-left:20px;line-height:1.8}.dim-note{color:#9aa7ad;font-size:12px}input[type=file]{display:none}@media(max-width:850px){.shell{grid-template-columns:1fr;height:auto}.side{border-left:0;border-top:1px solid #ffffff1c}.work{min-height:60vh}.map{width:100%}}
</style></head><body><header class="top"><div class="brand"><b>A+ QUEST GIVER</b><small>Visual Map Editor v3 · Regional Asset Architecture v1</small></div><div class="toolbar"><button id="previewBtn">Preview</button><button id="editBtn" class="on">Edit</button><button id="worldBtn">World Map</button><button id="exportBtn">Export JSON</button><label class="filebtn">Import JSON<input id="importFile" type="file" accept="application/json"></label><button id="resetBtn">Reset</button></div></header><main class="shell"><section class="work"><div id="map" class="map"><img id="mapimg" src="world-map.jpg" alt="A+ Quest Giver world map"><svg id="shade" class="shade-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><svg id="svg" class="edit-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="markers"></div><div id="hint" class="drawHint" hidden></div></div></section><aside id="side" class="side"></aside></main><script>
const KEY='aq-map-editor-v3-regional-assets';
const initial={version:1,regions:[
{id:'bit',regionalImage:'maps/bit-mines.jpg',name:'The Bit Mines',subtitle:'Hardware and foundational systems',status:'available',description:'Explore the mineral-rich hardware region.',locationsText:'Crystal Gallery\nControl Terminal\nCopperworks\nMotherlode\nData Veins\nPower Station',points:[],crop:null,locations:[]},
{id:'shopping',regionalImage:'maps/shopping-district.jpg',name:'Shopping District',subtitle:'Software and services',status:'available',description:'Explore the commercial district.',locationsText:'Market Square\nPrintworks\nCopy Shop\nCounterfeit Quarter\nThe Underground',points:[],crop:null,locations:[]},
{id:'reach',regionalImage:'maps/troubleshooters-reach.jpg',name:"Troubleshooter's Reach",subtitle:'Troubleshooting and operational recovery',status:'active',description:'Recover damaged systems, investigate failures, and restore operations.',locationsText:'Basecamp\nBurning Archive\nWatchtower\nEvacuation Route\nBroken Relay\nPrintworks\nThe Plant\nThe Summit\nMaintenance Depot',points:[],crop:null,locations:[]},
{id:'cloud',name:'Cloud Kingdom',subtitle:'Cloud and connected infrastructure',status:'available',description:'Explore connected and virtual infrastructure.',locationsText:'Cloud Kingdom\nMirror Citadel\nSky Station\nOrchard Station',points:[],crop:null,locations:[]},
{id:'deadmans',name:"Deadman's Port",subtitle:'Ports, peripherals, and connectivity',status:'locked',description:'Explore the eastern port region.',locationsText:"Harbor\nCustoms House\nLighthouse\nSmuggler's Cove\nShipyard (Tool Crib)\nSunken Cemetery\nService Platform",points:[],crop:null,locations:[]},
{id:'dispatch',regionalImage:'maps/dispatch.jpg',name:'Dispatch',subtitle:'Operations and support',status:'locked',description:'Explore support, evidence, and incident operations.',locationsText:'Dispatch\nThe Vault\nEvidence Lockup\nHelp Desk\nThe Oracle',points:[],crop:null,locations:[]},
{id:'guild',name:"The Adventurer's Guild",subtitle:'Player services and central progression',status:'available',description:'The central guild and player hub.',locationsText:'Grand Central',points:[],crop:null,locations:[]},
{id:'north',name:'The Northern Wilds',subtitle:'Northern frontier',status:'locked',description:'Explore the northern wilderness.',locationsText:'Penguin Station',points:[],crop:null,locations:[]}
]};
const tempRegionalPreviews={};let data=load(),mode='edit',view='world',selected='reach',tool=null,temp=[],drag=null;const $=s=>document.querySelector(s),map=$('#map'),svg=$('#svg'),shade=$('#shade'),side=$('#side'),markers=$('#markers'),hint=$('#hint');
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{let d=JSON.parse(localStorage.getItem(KEY))||clone(initial);d.regions.forEach(r=>{if(r.regionalImage&&!String(r.regionalImage).startsWith('data:'))r.regionalAsset=r.regionalImage;delete r.regionalImage;delete r.regionalImageName});return d}catch{return clone(initial)}}function save(){data.regions.forEach(r=>{delete r.regionalImage;delete r.regionalImageName});try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Settings could not be saved. Export JSON to preserve your work.')}}function reg(){return data.regions.find(r=>r.id===selected)}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pos(e){let r=map.getBoundingClientRect();return{x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))}}function points(a){return a.map(p=>p.x+','+p.y).join(' ')}function statusLabel(s){return({locked:'🔒 Locked',available:'○ Available',active:'▶ Active',completed:'✓ Completed'})[s]||s}
function render(){svg.innerHTML='';shade.innerHTML='';markers.innerHTML='';hint.hidden=!tool;hint.textContent=tool==='draw'?'Click around the region. Double-click to finish.':tool==='drawloc'?'Click points around the visible location. Double-click to finish.':'Click the regional map to add a location.';if(view==='world')renderWorld();else renderRegion();renderSide()}
function renderWorld(){map.style.aspectRatio='3/2';map.classList.remove('cropView');$('#mapimg').src='world-map.jpg';$('#mapimg').style.cssText='width:100%;height:100%;';data.regions.forEach(r=>{if(r.points.length<3)return;let p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.setAttribute('points',points(r.points));p.setAttribute('class','poly '+(r.id===selected?'active':''));p.setAttribute('tabindex','0');p.setAttribute('aria-label',r.name);p.onmouseenter=()=>mode==='preview'&&previewRegion(r);p.onmouseleave=()=>mode==='preview'&&clearPreview();p.onfocus=()=>mode==='preview'&&previewRegion(r);p.onclick=e=>{e.stopPropagation();selected=r.id;if(mode==='preview')enterRegion();else render()};svg.appendChild(p);if(mode==='edit'&&r.id===selected)r.points.forEach((v,i)=>vertex(v,i))});}
function vertex(v,i){let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',v.x);c.setAttribute('cy',v.y);c.setAttribute('r','0.8');c.setAttribute('class','vertex');c.onpointerdown=e=>{e.stopPropagation();drag={type:'vertex',i};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag?.type==='vertex'){let p=pos(e);reg().points[i]=p;save();render()}};c.onpointerup=()=>drag=null;svg.appendChild(c)}
function previewRegion(r){if(r.points.length>=3){shade.innerHTML='<path d="M0 0H100V100H0Z M'+r.points.map((p,i)=>(i?'L':'')+p.x+' '+p.y).join(' ')+'Z"/>'}selected=r.id;renderSide(true)}function clearPreview(){shade.innerHTML='';if(mode==='preview')renderSide()}
function regionBounds(r){if(!r||r.points.length<3)return null;let xs=r.points.map(p=>p.x),ys=r.points.map(p=>p.y);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);let pad=Number(r.zoomPadding??8)/100;let w=maxX-minX,h=maxY-minY;let x=Math.max(0,minX-w*pad),y=Math.max(0,minY-h*pad);let right=Math.min(100,maxX+w*pad),bottom=Math.min(100,maxY+h*pad);return{x,y,width:right-x,height:bottom-y}}function enterRegion(){let r=reg();if(!regionalSource(r)&&r.points.length<3){if(mode==='edit')alert('Upload a regional map or draw the world boundary first.');return}view=r.id;tool=null;render()}
function renderRegion(){let r=reg(),source=regionalSource(r),custom=!!source,c=custom?{x:0,y:0,width:100,height:100}:regionBounds(r);if(!c){view='world';return render()}map.classList.add('cropView');let img=$('#mapimg');img.src=custom?r.regionalImage:'world-map.jpg';if(custom){img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:contain;'}else{let sx=100/c.width,sy=100/c.height;img.style.width=(100*sx)+'%';img.style.height=(100*sy)+'%';img.style.left=(-c.x*sx)+'%';img.style.top=(-c.y*sy)+'%';}r.locations.forEach((l,i)=>{if(l.points&&l.points.length>=3){let pg=document.createElementNS('http://www.w3.org/2000/svg','polygon');pg.setAttribute('points',points(l.points));pg.setAttribute('class','poly '+(l.selected?'active':''));pg.setAttribute('tabindex','0');pg.setAttribute('aria-label',l.name);pg.onclick=e=>{e.stopPropagation();r.locations.forEach((x,j)=>x.selected=i===j);renderSide()};svg.appendChild(pg);return}let b=document.createElement('button');b.className='loc '+l.type+' '+l.status;b.style.left=((l.x-c.x)/c.width*100)+'%';b.style.top=((l.y-c.y)/c.height*100)+'%';b.innerHTML=(l.type==='station'?'T':l.type==='hidden'?'?':'•')+'<span>'+esc(l.name)+' · '+statusLabel(l.status)+'</span>';b.setAttribute('aria-label',l.name);b.onclick=e=>{e.stopPropagation();l.selected=true;r.locations.forEach((x,j)=>{if(j!==i)x.selected=false});renderSide()};if(mode==='edit')b.onpointerdown=e=>{drag={type:'loc',i};b.setPointerCapture(e.pointerId)};b.onpointermove=e=>{if(drag?.type==='loc'){let p=pos(e);l.x=c.x+p.x/100*c.width;l.y=c.y+p.y/100*c.height;save();renderRegion();renderSide()}};b.onpointerup=()=>drag=null;markers.appendChild(b)})}
map.onclick=e=>{if(mode!=='edit'||!tool)return;let p=pos(e),r=reg();if(view==='world'&&tool==='draw'){temp.push(p);renderTemp()}else if(view!=='world'&&tool==='drawloc'){temp.push(p);render();let q=document.createElementNS('http://www.w3.org/2000/svg','polyline');q.setAttribute('points',points(temp));q.setAttribute('class','poly');svg.appendChild(q)}else if(view!=='world'&&tool==='addloc'){let c=regionBounds(r);r.locations.push({name:'New Location',type:'standard',status:'available',x:c.x+p.x/100*c.width,y:c.y+p.y/100*c.height,description:'',selected:true});r.locations.slice(0,-1).forEach(x=>x.selected=false);tool=null;save();render()}};
map.ondblclick=e=>{if(mode!=='edit'||temp.length<3)return;if(view==='world'&&tool==='draw'){e.preventDefault();reg().points=temp}else if(view!=='world'&&tool==='drawloc'){e.preventDefault();let rr=reg();rr.locations.forEach(x=>x.selected=false);rr.locations.push({name:'New Location',type:'standard',status:'available',points:temp,description:'',selected:true})}else return;temp=[];tool=null;save();render()};
function renderTemp(){renderWorld();let p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',points(temp));p.setAttribute('class','poly');svg.appendChild(p)}
map.onpointerdown=e=>{if(false){let p=pos(e);drag={type:'crop',start:p};map.setPointerCapture(e.pointerId)}};map.onpointermove=e=>{if(false){let p=pos(e),s=drag.start;reg().crop={x:Math.min(s.x,p.x),y:Math.min(s.y,p.y),width:Math.abs(p.x-s.x),height:Math.abs(p.y-s.y)};renderWorld();renderSide()}};map.onpointerup=e=>{if(false){drag=null;tool=null;save();render()}};

function regionalSource(r){return tempRegionalPreviews[r.id]||r.regionalAsset||null}function regionalState(r){return tempRegionalPreviews[r.id]?'temporary':r.regionalAsset?'project':'fallback'}function cleanupPreview(id){if(tempRegionalPreviews[id]){URL.revokeObjectURL(tempRegionalPreviews[id]);delete tempRegionalPreviews[id]}}function setProjectAsset(){let r=reg(),v=prompt('Repository path, for example: ./public/maps/cloud-kingdom.jpg',r.regionalAsset||'./public/maps/');if(!v)return;r.regionalAsset=v.trim();cleanupPreview(r.id);save();render()}function addRegionalUploadUI(r){let state=regionalState(r),host=document.createElement('div');host.className='card';let labels={project:'✓ PROJECT MAP',temporary:'⚠ TEMPORARY PREVIEW',fallback:'○ WORLD-MAP FALLBACK'};host.innerHTML='<b>'+labels[state]+'</b><br><small>'+(state==='project'?esc(r.regionalAsset):state==='temporary'?'Memory-only preview. Not saved or exported.':'No project map. Boundary zoom is the fallback.')+'</small><br>';let label=document.createElement('label');label.className='filebtn';label.style.cssText='display:inline-block;margin-top:8px';label.textContent=state==='temporary'?'Replace Preview':'Preview Local Image';let input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp';input.onchange=previewRegionImage;label.appendChild(input);host.appendChild(label);let path=document.createElement('button');path.textContent='Set Project Asset Path';path.style.marginLeft='6px';path.onclick=setProjectAsset;host.appendChild(path);if(state!=='fallback'){let rm=document.createElement('button');rm.textContent=state==='temporary'?'Clear Preview':'Clear Project Map';rm.style.margin='6px 0 0 6px';rm.onclick=removeRegionImage;host.appendChild(rm)}let en=document.createElement('button');en.textContent='Enter Regional Editor';en.className='primary';en.style.cssText='display:block;margin-top:9px;width:100%';en.disabled=!(regionalSource(r)||r.points.length>=3);en.onclick=enterRegion;host.appendChild(en);side.insertBefore(host,side.children[1]||null)}function previewRegionImage(e){let f=e.target.files&&e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){alert('Choose a PNG, JPG/JPEG, or WebP image.');return}let r=reg();cleanupPreview(r.id);tempRegionalPreviews[r.id]=URL.createObjectURL(f);render()}function removeRegionImage(){let r=reg(),state=regionalState(r);if(state==='temporary')cleanupPreview(r.id);else if(state==='project'){delete r.regionalAsset;save()}if(view!=='world'&&!regionalSource(r)&&r.points.length<3)view='world';render()}
function renderSide(preview=false){let r=reg();if(mode==='preview'&&view==='world'){if(!preview){side.innerHTML='<div class="modeBadge">PLAYER PREVIEW</div><h2>Explore the World</h2><p>Hover or keyboard-focus a configured region to preview it. Select a region to enter its regional view.</p><p class="dim-note">Railways remain visible as world geography. Stations become selectable only inside their region.</p>';return}side.innerHTML='<div class="modeBadge">REGION PREVIEW</div><div class="preview-title">'+esc(r.name)+'</div><p>'+esc(r.subtitle)+'</p><p>'+esc(r.description)+'</p><h3>Locations</h3><ul class="preview-list">'+r.locationsText.split('\n').filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p><span class="status">'+statusLabel(r.status)+'</span></p><button class="primary" onclick="enterRegion()">Enter Region</button>';return}if(mode==='preview'&&view!=='world'){side.innerHTML='<div class="crumb">World Map › '+esc(r.name)+'</div><div class="modeBadge">REGIONAL PREVIEW</div><h2>'+esc(r.name)+'</h2><p>'+esc(r.description)+'</p><h3>Locations</h3>'+(r.locations.length?r.locations.map(l=>'<p>• '+esc(l.name)+' <span class="status">'+statusLabel(l.status)+'</span></p>').join(''):'<p class="empty">No regional markers have been placed yet.</p>')+'<button onclick="goWorld()">← Return to World Map</button>';return}if(view==='world'){editWorldSide(r);addRegionalUploadUI(r)}else{editRegionSide(r);addRegionalUploadUI(r)}}
function editWorldSide(r){side.innerHTML='<div class="modeBadge">EDIT WORLD MAP</div><h3>Regions</h3><div class="region-list">'+data.regions.map(x=>'<button class="'+(x.id===selected?'on':'')+'" onclick="selectRegion(\''+x.id+'\')">'+esc(x.name)+'</button>').join('')+'</div><h3>Selected Region</h3><div class="fields"><label>Name<input id="rn" value="'+esc(r.name)+'"></label><label>Subtitle<input id="rs" value="'+esc(r.subtitle)+'"></label><label>Description<textarea id="rd">'+esc(r.description)+'</textarea></label><label>Preview location list<textarea id="rl">'+esc(r.locationsText)+'</textarea></label><label>Status<select id="rst">'+['locked','available','active','completed'].map(s=>'<option '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div><h3>Region Boundary & Zoom</h3><div class="row"><button onclick="startDraw()">Draw Boundary</button><button onclick="clearBoundary()">Clear Boundary</button></div><label style="display:block;margin:10px 0;font-size:12px;color:#bac4c8">Zoom Padding <input id="zp" type="range" min="0" max="25" step="1" value="'+(r.zoomPadding??8)+'"><span id="zpv"> '+(r.zoomPadding??8)+'%</span></label><button style="width:100%" '+(r.points.length<3?'disabled':'')+' onclick="enterRegion()">Enter Region</button><div class="help"><b>Unified boundary:</b> this single polygon defines the hover/highlight area and the regional zoom. Click points around the geography and double-click to close. Drag the white vertices to fine-tune it.<br><br>The regional view automatically frames the polygon using its bounding box plus the adjustable Zoom Padding above. There is no separate crop.</div>';['rn','rs','rd','rl','rst'].forEach(id=>$('#'+id).oninput=()=>{r.name=$('#rn').value;r.subtitle=$('#rs').value;r.description=$('#rd').value;r.locationsText=$('#rl').value;r.status=$('#rst').value;save()});$('#zp').oninput=()=>{r.zoomPadding=Number($('#zp').value);$('#zpv').textContent=' '+r.zoomPadding+'%';save()}}
function editRegionSide(r){let l=r.locations.find(x=>x.selected);side.innerHTML='<div class="crumb">World Map › '+esc(r.name)+'</div><div class="modeBadge">EDIT REGIONAL VIEW</div><h2>'+esc(r.name)+'</h2><div class="row"><button class="primary" onclick="addLocation()">+ Point</button><button class="primary" onclick="drawLocation()">+ Draw Location</button></div><button style="width:100%;margin-top:6px" onclick="goWorld()">← World</button><h3>Placed Locations</h3>'+(r.locations.length?r.locations.map((x,i)=>'<button style="display:block;width:100%;margin:4px 0;text-align:left" onclick="pickLoc('+i+')">'+(x.type==='station'?'T ':x.type==='hidden'?'? ':'• ')+esc(x.name)+'</button>').join(''):'<p class="empty">No markers yet. Choose + Add Location, then click the map.</p>')+(l?'<h3>Location Properties</h3><div class="fields"><label>Name<input id="ln" value="'+esc(l.name)+'"></label><label>Type<select id="lt"><option value="standard">Standard Location</option><option value="station">Railway Station</option><option value="hidden">Hidden Location</option></select></label><label>Status<select id="ls">'+['locked','available','active','completed'].map(s=>'<option '+(s===l.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Description<textarea id="ld">'+esc(l.description||'')+'</textarea></label><button class="danger" onclick="deleteLoc()">Delete Location</button></div>':'')+'<div class="help">Drag markers directly on the cropped map. Railway stations are regional locations, not world-map buttons.</div>';if(l){$('#lt').value=l.type;['ln','lt','ls','ld'].forEach(id=>$('#'+id).oninput=()=>{l.name=$('#ln').value;l.type=$('#lt').value;l.status=$('#ls').value;l.description=$('#ld').value;save();renderRegion()})}}
function selectRegion(id){selected=id;tool=null;temp=[];render()}function startDraw(){tool='draw';temp=[];render()}function clearBoundary(){reg().points=[];save();render()}function addLocation(){tool='addloc';render()}function drawLocation(){tool='drawloc';temp=[];render()}function importRegionImage(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{reg().regionalImage=rd.result;save();render()};rd.readAsDataURL(f)}function removeRegionImage(){delete reg().regionalImage;save();render()}function pickLoc(i){reg().locations.forEach((x,j)=>x.selected=i===j);renderSide()}function deleteLoc(){let r=reg();r.locations=r.locations.filter(x=>!x.selected);save();render()}function goWorld(){view='world';tool=null;render()}previewBtn.onclick=()=>{mode='preview';tool=null;previewBtn.classList.add('on');editBtn.classList.remove('on');render()};editBtn.onclick=()=>{mode='edit';editBtn.classList.add('on');previewBtn.classList.remove('on');render()};worldBtn.onclick=goWorld;exportBtn.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='APlusMapLayout.json';a.click();URL.revokeObjectURL(a.href)};importFile.onchange=async e=>{try{let incoming=JSON.parse(await e.target.files[0].text());if(!incoming.regions)throw 0;data=incoming;save();selected=data.regions[0].id;view='world';render()}catch{alert('That file is not a valid A+ map layout export.')}};resetBtn.onclick=()=>{if(confirm('Reset the editor to the original empty region configuration?')){data=clone(initial);save();view='world';selected='reach';render()}};render();
</script></body></html>
